<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Update Component</title>
</head>
<body>
    <div id="back">
        <a href="home.html">Home</a>
    </div>
    <h1>Update Component</h1>
    <form id="updateForm">
        <label for="id">ID:</label>
        <input type="text" id="id" name="id" required><br><br>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="supplier">Supplier:</label>
        <input type="text" id="supplier" name="supplier" required><br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required><br><br>

        <label for="unit">Unit on Stock:</label>
        <input type="number" id="unit" name="unit" required><br><br><br>

        <button type="submit">Update</button>
    </form>
</body>
<script>
    document.getElementById("updateForm").addEventListener("submit", function (event) {
        event.preventDefault();

        var id = document.getElementById("id").value;
        var name = document.getElementById("name").value;
        var supplier = document.getElementById("supplier").value;
        var price = document.getElementById("price").value;
        var unit = document.getElementById("unit").value;
        const data = { name: name, supplier: supplier, price: price, unit: unit };

        fetch(`/update/${id}`, {
            method: "put",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(error => {
                console.error(error);
                alert('An error occurred!');
            });
    });
</script>

</html>
