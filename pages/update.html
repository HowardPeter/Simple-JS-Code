<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Update Component</title>
</head>

<body>
    <div id="back">
        <a href="home.html">Home</a>
    </div>
    <h1>Update Component</h1>
    <form id="updateForm">
        <label for="id">ID:</label>
        <input type="text" id="id" name="id" readonly><br><br>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="supplier">Supplier:</label>
        <input type="text" id="supplier" name="supplier" required><br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" required><br><br>

        <label for="unit">Unit on Stock:</label>
        <input type="number" id="unit" name="unit" required><br><br><br>

        <button type="button" onclick="updateComp()">Update</button>
    </form>
</body>
<script>
    const queryParams = new URLSearchParams(window.location.search);
    const oldComp = Object.fromEntries(queryParams.entries());
    let newComp = oldComp;

    document.getElementById('id').value = oldComp.id;
    document.getElementById('name').value = oldComp.name;
    document.getElementById('supplier').value = oldComp.supplier;
    document.getElementById('price').value = oldComp.price;
    document.getElementById('unit').value = oldComp.unitonstock;

    function updateComp() {
        newComp.name = document.getElementById('name').value;
        newComp.supplier = document.getElementById('supplier').value;
        newComp.price = document.getElementById('price').value;
        newComp.unitonstock = document.getElementById('unit').value;

        fetch('/update', {
            method: 'put',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newComp)
        })
            .then(response => response.json())
            .then(data => alert(data.message))
            .catch(error => {
                console.error(error);
                alert('An error occurred!');
            });
    }
</script>

</html>
