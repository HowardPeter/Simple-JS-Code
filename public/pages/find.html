<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/find.css">
    <title>Product Table</title>
</head>

<body>
    <div class="search-container">
        <h2>Search Component</h2>
        <form action="/read" method="GET">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Search by Name...">

            <label for="supplier">Supplier:</label>
            <input type="text" id="supplier" name="supplier" placeholder="Search by Supplier...">

            <label for="minPrice">Price:</label>
            <input type="number" id="minPrice" name="minPrice" placeholder="From">
            <input type="number" id="maxPrice" name="maxPrice" placeholder="to">

            <br><br><label>Units on stock:</label>
            <input type="number" id="minUnit" name="minUnit" placeholder="From">
            <input type="number" id="maxUnit" name="maxUnit" placeholder="to">

            <br><br><button type="submit">Search</button>
        </form>
    </div>
</body>
<script>
    fetch('/read', {
        method: 'get',
        headers: { 'Content-Type': 'application/json' },
    })
        .then(response => response.json())
        .then(data => alert(data.table))
</script>

</html>
