<!DOCTYPE html>
<html>

<head>
    <title>Deleted Component List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: center;
            padding: 8px;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            margin-left: 10px;
        }

        .back a {
            text-decoration: none;
            padding: 10px 25px;
            border: 2px solid black;
            color: black;
            border-radius: 15px;
            transition: background-color 0.3s;
        }

        .back a:hover {
            background-color: black;
            color: white;
        }

        .deleteAll {
            text-align: right;
            margin-top: 15px;
            margin-right: 30px;
        }
    </style>
</head>

<body>
    <div class="backButton">
        <div class="back">
            <a href="home.html">Home</a>
        </div>
        <div class="back">
            <a href="delete.html">Back</a>
        </div>
    </div>
    <h1>Delete Component List</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Supplier</th>
                <th>Price</th>
                <th>Unit on stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="componentTable">
            <!-- Dữ liệu sẽ được thêm vào đây -->
        </tbody>
    </table>
    <div class="deleteAll">
        <a href="">Delete All</a>
    </div>
</body>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const resultData = JSON.parse(urlParams.get('results'));

    var computer_components = resultData;

    var componentTable = document.getElementById("componentTable");

    computer_components.forEach(function (component) {
        var row = document.createElement("tr");

        var idCell = document.createElement("td");
        idCell.textContent = component.id;
        row.appendChild(idCell);

        var nameCell = document.createElement("td");
        nameCell.textContent = component.name;
        row.appendChild(nameCell);

        var supplierCell = document.createElement("td");
        supplierCell.textContent = component.supplier;
        row.appendChild(supplierCell);

        var priceCell = document.createElement("td");
        priceCell.textContent = component.price + "$";
        row.appendChild(priceCell);

        var unitCell = document.createElement("td");
        unitCell.textContent = component.unitonstock;
        row.appendChild(unitCell);

        var actionCell = document.createElement("td");
        var deleteLink = document.createElement("a");
        deleteLink.href = "#";
        deleteLink.textContent = "Delete";
        deleteLink.addEventListener("click", function (event) {
            if (confirm("Are you sure to delete component " + component.id + "?")) {
                fetch("/delete/" + component.id, {
                    method: "DELETE",
                    headers: { 'Content-Type': 'application/json' }
                })
                    .then(response => response.json())
                    .then(data => {
                        // if (response.ok) {
                        //     alert("Deleted component with id: " + component.id);
                        // } else {
                        //     alert("Delete failed!");
                        // }
                        alert(data.message);
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        alert("Error occurred!");
                    });
            }
        });
        actionCell.appendChild(deleteLink);
        row.appendChild(actionCell);

        componentTable.appendChild(row);
    });

    document.querySelector('.deleteAll a').addEventListener('click', function (event) {
        event.preventDefault();

        if (confirm("Are you sure you want to delete all components?")) {
            fetch("/deleteAll", {
                method: "DELETE",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(computer_components)
            })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Error occurred!");
                });
        }
    });

</script>

</html>
