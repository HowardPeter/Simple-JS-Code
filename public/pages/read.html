<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/readUpdate.css">
    <title>Product Table</title>
</head>
<style>
    input[type="number"] {
        max-width: 175px;
    }
</style>

<body onload="setFocus()">
    <div class="back">
        <a href="home.html">Home</a>
    </div>
    <h1>Search Component</h1>
    <div class="search-container">
        <form action="/read" method="GET">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="supplier">Supplier:</label>
            <input type="text" id="supplier" name="supplier">

            <label for="minPrice">Price:</label>
            <input type="number" id="minPrice" name="minPrice" placeholder="From">
            <input type="number" id="maxPrice" name="maxPrice" placeholder="to" style="margin-left: 5px;">

            <label>Units on stock:</label>
            <input type="number" id="minUnit" name="minUnit" placeholder="From">
            <input type="number" id="maxUnit" name="maxUnit" placeholder="to" style="margin-left: 5px;">

            <br><button type="submit">Search</button>
            <button type="reset" onclick="setFocus()">Refresh</button>
        </form>
    </div>
</body>
<script>
    function setFocus() {
        document.getElementById("name").focus();
    }
</script>

</html>
